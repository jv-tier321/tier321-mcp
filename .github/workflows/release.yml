name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: git merge-base --is-ancestor HEAD origin/main
      - id: plan
        run: node scripts/release-plan.mjs
  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release commit on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: node --version
      - run: node --test scripts/*.test.mjs
      - run: npm run audit
      - run: npm run check
      - run: npm run verify:release
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      - run: npm run package:release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: release/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release
      - name: Verify immutable tag and existing release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync } from 'node:fs';
          // BEGIN TESTED PUBLICATION GUARD
          /**
           * Ensure the immutable tag identifies the tested commit, creating it if absent.
           * Return true only for an already complete release; reject conflicts and partial publication.
           */
          async function ensureTag(api, tag, sha) {
            assert.match(tag, /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
            assert.match(sha, /^[0-9a-f]{40}$/);
            const path = `/git/ref/tags/${tag}`;
            let ref = await api(path);
            if (!ref) {
              await api('/git/refs', { ref: `refs/tags/${tag}`, sha });
              ref = await api(path);
            }
            let object = ref?.object;
            for (let depth = 0; object?.type === 'tag' && depth < 5; depth++) {
              assert.match(object.sha, /^[0-9a-f]{40}$/);
              object = (await api(`/git/tags/${object.sha}`))?.object;
            }
            assert(object?.type === 'commit' && object.sha === sha, 'Existing tag does not identify the tested commit; never move it');
            const release = await api(`/releases/tags/${tag}`);
            if (!release) return false;
            assert(release.tag_name === tag && !release.draft && !release.prerelease, 'Existing release is incomplete');
            const names = [`tier321-mcp-${tag.slice(1)}.tar.gz`, 'SHA256SUMS'].sort();
            assert.deepEqual(release.assets.map(a => a.name).sort(), names, 'Existing release assets are incomplete');
            assert(release.assets.every(a => a.state === 'uploaded' && a.size > 0 && /^sha256:[0-9a-f]{64}$/.test(a.digest)), 'Existing assets lack completion/digest evidence');
            return true;
          }
          // END TESTED PUBLICATION GUARD
          const { GH_REPO: repo, GH_TOKEN: token, RELEASE_TAG: tag, RELEASE_SHA: sha } = process.env;
          assert.match(repo, /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/);
          assert(token);
          const api = async (path, body) => {
            const response = await fetch(`https://api.github.com/repos/${repo}${path}`, {
              method: body ? 'POST' : 'GET', redirect: 'error', signal: AbortSignal.timeout(30000),
              headers: { authorization: `Bearer ${token}`, accept: 'application/vnd.github+json',
                'content-type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
              ...(body ? { body: JSON.stringify(body) } : {}),
            });
            if (!body && response.status === 404) return null;
            assert(response.ok, `GitHub request failed: ${response.status}`);
            return response.json();
          };
          const published = await ensureTag(api, tag, sha);
          appendFileSync(process.env.GITHUB_OUTPUT, `published=${published}\n`);
          NODE
      - name: Verify and publish the tested bundle
        if: steps.tag.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cd release
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md "tier321-mcp-${RELEASE_TAG#v}.tar.gz" SHA256SUMS
