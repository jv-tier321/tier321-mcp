name: Bug report
description: Something is broken or behaving incorrectly.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. **Security issues do NOT go here** — see `SECURITY.md`.
        This issue is public. Use fictional data and placeholder hostnames. Remove credentials, cookies, account identifiers, customer information and internal details from commands, logs and screenshots. See `docs/PUBLIC_POC.md`.
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit SHA or tag where you reproduced this.
      placeholder: v0.2.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version, operating system, deploy target (local / Cloudflare).
      placeholder: Node 22.11 / macOS 14 / local wrangler dev
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Minimal commands or requests using synthetic data and placeholder deployment values; omit authentication headers.
      placeholder: |
        1. `npm ci --ignore-scripts`
        2. `npm run dev`
        3. `curl -X POST ...`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include a sanitized error summary. Inspect any logs or screenshots for private information before attaching them.
    validations:
      required: true
